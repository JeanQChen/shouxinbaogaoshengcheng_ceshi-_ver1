contract_version: v1

# 缺失策略目录：规定“缺失 / 未检索到 / 冲突 / 不适用”时如何书写与处理。
# 通用语义，不绑定任何具体公司、行业或业务。
policies:
  missing:
    - policy_id: write_not_found
      description: 明确写“未在给定材料及已执行来源中检索到”，不视为事实不存在，允许带缺口预览
    - policy_id: write_not_found_disclose
      description: 依法未披露（如客户/供应商名称）时标注“依法未披露”，不视为事实不存在，不阻断
    - policy_id: transfer_human
      description: 转人工确认（WAITING_HUMAN）后再继续受影响部分
    - policy_id: valid_no_controller
      description: “无实际控制人”是合法结论（SATISFIED），与控制关系无法确认（WAITING_HUMAN）区分
    - policy_id: not_applicable_no_plan
      description: 无相关计划/安排时记为合法不适用（NOT_APPLICABLE），不阻断
    - policy_id: proxy_allowed
      description: 权威数据缺失时允许使用明确标注来源与口径的代理指标，并记录原目标指标/实际替代指标/替代理由/来源日期/口径/局限性六项；缺单一数字不阻断，仅核心内容整体不足才 SECTION_BLOCKED
    - policy_id: conflict_pause
      description: 冲突只暂停受影响的计算与 Claim，解决前阻止正式导出
    - policy_id: missing_material
      description: 所需材料未上传或字段未提供（NOT_PROVIDED），明确标注缺失期间/字段，按 blocking_policy 决定是否阻断

# 命名条件（授信类型白名单）
conditions:
  - condition_id: c_working_capital
    kind: credit_type_in
    field: credit_type
    op: in
    value: [working_capital]
  - condition_id: c_trade_finance
    kind: credit_type_in
    field: credit_type
    op: in
    value: [trade_finance]
  - condition_id: c_fixed_asset_or_project
    kind: credit_type_in
    field: credit_type
    op: in
    value: [fixed_asset, project_loan]

sections:
  # ------------------------------------------------------------------
  # 1. 公司信用研究
  # ------------------------------------------------------------------
  - section_id: company
    title: 公司信用研究
    purpose: 确认申请授信的法人主体是否合法存续、控制权是否清晰、经营是否有效，及其业务与经营能力能否支持还款。实际控制人用于判断控制权与治理风险，不等同于借款主体。
    research_policy: harness
    allowed_capabilities: [search_evidence, search_tables, inspect_evidence, compare_evidence, verify_claim, search_external_sources]
    required_topics:
      - topic_id: company_identity
        title: 企业基本信息与历史沿革
        required: true
        key_questions:
          - question_id: company_subject_match
            question: 核对输入企业名称、材料内主体、股票代码与公开企业信息是否一致
            required_aspects:
              - 输入企业名称与材料主体一致性
              - 股票代码
              - 经营状态
            priority: P0
            blocking_policy: [JOB_BLOCKED]
            impact_scope: [subject]
            missing_policy: transfer_human
            evidence_requirements:
              - requirement_id: er_comp_subject
                evidence_kind: field
                source_classes: [company_industry, structured_db, external]
                minimum_sources: 1
                required_fields: [企业名称, 股票代码, 经营状态]
          - question_id: company_identity_basic
            question: 成立日期、办公地址、法定代表人、注册资本、实缴资本和经营范围
            required_aspects:
              - 成立日期
              - 办公地址
              - 法定代表人
              - 注册资本
              - 实缴资本
              - 经营范围
            priority: P0
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_basic
                evidence_kind: field
                source_classes: [company_industry]
                minimum_sources: 1
                required_fields: [成立日期, 办公地址, 法定代表人, 注册资本, 实缴资本, 经营范围]
          - question_id: company_identity_history
            question: 历史沿革：重大改革、股权变更、法定代表人变更、上市及重大募资事项
            required_aspects:
              - 重大改革与股权变更
              - 法定代表人变更
              - 上市及重大募资事项
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_history
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_control
        title: 股权结构、控股股东、实际控制人及控制链条
        required: true
        key_questions:
          - question_id: company_control_chain
            question: 控股股东、实际控制人及控制链条（含可视化关系图）；合法无实际控制人为 SATISFIED，无法确认时 REPORT_BLOCKED
            required_aspects:
              - 控股股东
              - 实际控制人
              - 持股比例与控制链条
            priority: P0
            blocking_policy: [REPORT_BLOCKED]
            impact_scope: [subject]
            missing_policy: valid_no_controller
            evidence_requirements:
              - requirement_id: er_comp_control
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
                required_fields: [控股股东, 实际控制人, 持股比例]
      - topic_id: company_subsidiaries
        title: 主要子公司、集团结构与重要关联方
        required: true
        key_questions:
          - question_id: company_subsidiaries
            question: 主要子公司、集团结构与重要关联方
            required_aspects:
              - 主要子公司
              - 集团结构
              - 重要关联方
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_subs
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_business
        title: 主营业务、经营模式、产业链、收入成本毛利构成、客户与供应商集中度
        required: true
        key_questions:
          - question_id: company_business_main
            question: 主营业务、收入/成本/毛利构成与产业链位置；主营业务完全无法确认时阻断章节
            required_aspects:
              - 主营业务构成
              - 各业务收入及收入占比
              - 各业务成本与毛利构成
              - 产业链位置
              - 对应报告期与口径
            priority: P0
            blocking_policy: [SECTION_BLOCKED]
            impact_scope: [subject]
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_business_main
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
                required_fields: [主营业务, 收入构成, 毛利构成]
          - question_id: company_business_model
            question: 采购/生产/销售模式、技术路线、成本与竞争能力
            required_aspects:
              - 采购生产销售模式
              - 技术路线
              - 成本与竞争能力
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_business_model
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
          - question_id: company_customer_concentration
            question: 客户集中度（客户名称依法未披露时标注“依法未披露”，不视为缺失或不存在）
            required_aspects:
              - 客户集中度
              - 依法未披露时的标注
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found_disclose
            evidence_requirements:
              - requirement_id: er_comp_customer
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
          - question_id: company_supplier_concentration
            question: 供应商集中度
            required_aspects:
              - 供应商集中度
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_supplier
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_competitiveness
        title: 核心竞争力、研发能力、发展计划和在建工程
        required: true
        key_questions:
          - question_id: company_competitiveness
            question: 核心竞争力
            required_aspects:
              - 核心竞争力
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_competitive
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
          - question_id: company_rd_capacity
            question: 研发能力、发展计划与在建工程
            required_aspects:
              - 研发能力
              - 发展计划
              - 在建工程
            priority: P2
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_rd
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_governance
        title: 公司治理、内控、管理层稳定性及主要管理人员履历
        required: true
        key_questions:
          - question_id: company_governance
            question: 治理结构、内控、管理层稳定性及主要管理人员履历
            required_aspects:
              - 治理结构与内控
              - 管理层稳定性
              - 主要管理人员履历
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_governance
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_legal_risks
        title: 重大诉讼、违约、处罚、失信、退市风险、关联交易、股权质押和舆情
        required: true
        key_questions:
          - question_id: company_litigation
            question: 重大诉讼、违约、处罚、失信与退市风险（无发现也须记录检索范围与截止日期）
            required_aspects:
              - 重大诉讼与处罚
              - 失信与退市风险
              - 检索范围与截止日期
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_litigation
                evidence_kind: paragraph
                source_classes: [company_industry, external]
                minimum_sources: 1
          - question_id: company_related_transactions
            question: 关联交易（采购/销售/担保）的合规性与占比
            required_aspects:
              - 关联采购销售担保
              - 关联交易占比
              - 合规性
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_related
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
          - question_id: company_pledge_sentiment
            question: 股权质押与舆情
            required_aspects:
              - 股权质押情况
              - 舆情
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_pledge
                evidence_kind: paragraph
                source_classes: [company_industry, external]
                minimum_sources: 1
      - topic_id: company_debt
        title: 债务、授信、发债、金融机构借款和对外担保
        required: true
        key_questions:
          - question_id: company_debt_credit
            question: 授信额度及已用规模；材料明显缺失无法核实时不生成对应偿债结论
            required_aspects:
              - 公司整体授信额度及使用情况
            priority: P0
            blocking_policy: [REPORT_BLOCKED]
            impact_scope: [solvency]
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_credit
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
          - question_id: company_debt_guarantee
            question: 发债、金融机构借款和对外担保（结构化表格呈现）；材料明显缺失无法核实时不生成对应偿债结论
            required_aspects:
              - 发债情况
              - 金融机构借款
              - 公司整体对外担保余额
              - 担保范围口径与报告期
            priority: P0
            blocking_policy: [REPORT_BLOCKED]
            impact_scope: [solvency]
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_guarantee
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_profit_quality
        title: 非主营业务和利润质量
        required: true
        key_questions:
          - question_id: company_profit_quality
            question: 非主营损益（投资收益、公允价值变动、减值、营业外收支）及利润质量
            required_aspects:
              - 非主营损益构成
              - 利润质量
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_profit_quality
                evidence_kind: table
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_investment
        title: 重大投资、收并购、资产出售、定向增发等影响经营的事件
        required: true
        key_questions:
          - question_id: company_investment
            question: 重大投资、收并购、资产出售与定向增发等影响经营的事件
            required_aspects:
              - 重大投资与收并购
              - 资产出售
              - 定向增发
            priority: P2
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_investment
                evidence_kind: paragraph
                source_classes: [company_industry, external]
                minimum_sources: 1
      - topic_id: company_equity_incentive
        title: 股权激励计划及进展
        required: true
        key_questions:
          - question_id: company_equity_incentive
            question: 股权激励计划及进展（无相关计划时为 NOT_APPLICABLE，不阻断）
            required_aspects:
              - 股权激励计划及进展
              - 无计划时为不适用
            priority: P2
            blocking_policy: NONE
            missing_policy: not_applicable_no_plan
            evidence_requirements:
              - requirement_id: er_comp_equity
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
      - topic_id: company_credit_summary
        title: 公司层面核心信用优势、风险及其偿债影响
        required: true
        key_questions:
          - question_id: company_credit_summary
            question: 公司核心信用优势、风险、偿债影响与未解决问题
            required_aspects:
              - 核心信用优势
              - 核心风险
              - 偿债影响与未解决问题
            priority: P0
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_comp_summary
                evidence_kind: paragraph
                source_classes: [company_industry]
                minimum_sources: 1
    output_requirements:
      - requirement_id: or_company_structure
        kind: structured
        description: 主体、控制链可视化、主营、风险与债务结构化结论
    completion_rules:
      - rule_id: company_rule_subject
        scope_id: company
        condition: { kind: always }
        outcome: 主体、股票代码、经营状态、报告时点明确，且输入主体与材料主体一致
      - rule_id: company_rule_core
        scope_id: company
        condition: { kind: always }
        outcome: 主营、控制关系、债务、担保、关联交易、客户与供应商集中度为必答；未检索到须逐项明确写出
    evaluation_rules:
      - rule_id: company_eval_fact_judgment
        description: 事实与分析判断分开表达，每个关键事实绑定证据，每个风险判断回指支持事实

  # ------------------------------------------------------------------
  # 2. 财务分析（确定性 Workflow，Python/SQL 计算，LLM 只解读）
  # ------------------------------------------------------------------
  - section_id: financial
    title: 财务分析
    purpose: 先判断报表是否可信，再以确定性数据和计算结果评价偿债、盈利、营运、现金流与增长质量，判断其能否支持用户提出的授信方案。
    research_policy: workflow
    allowed_capabilities: [lookup_financial_metric]
    required_topics:
      - topic_id: fin_source_scope
        title: 数据来源、口径、报告期、合并范围、单位、审计意见与事务所
        required: true
        key_questions:
          - question_id: fin_statements_availability
            question: 最新完整年度三张主表（资产负债表、利润表、现金流量表）与审计意见齐备；趋势原则上覆盖近三年；最新季度/半年可用则纳入，否则披露缺口；缺最新完整年度任一主表即阻断
            required_aspects:
              - 资产负债表齐备
              - 利润表齐备
              - 现金流量表齐备
              - 审计意见
              - 近三年趋势覆盖
            priority: P0
            blocking_policy: [SECTION_BLOCKED, REPORT_BLOCKED]
            impact_scope: [key_financial]
            missing_policy: missing_material
            evidence_requirements:
              - requirement_id: er_fin_stmt
                evidence_kind: structured_db
                source_classes: [financial]
                minimum_sources: 1
                required_fields: [资产负债表, 利润表, 现金流量表]
          - question_id: fin_audit_opinion
            question: 审计意见、会计师事务所、报告期、合并范围与单位（不要求三份独立审计报告，可从历年年报/最新年报比较披露取得；报告期间/金额单位/合并或母公司口径无法确认即阻断）
            required_aspects:
              - 审计意见
              - 会计师事务所
              - 报告期
              - 合并范围
              - 金额单位
            priority: P1
            blocking_policy: [SECTION_BLOCKED, REPORT_BLOCKED]
            impact_scope: [key_financial]
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_fin_audit
                evidence_kind: field
                source_classes: [financial]
                minimum_sources: 1
                required_fields: [审计意见, 会计师事务所, 报告期, 合并范围, 单位]
      - topic_id: fin_consistency
        title: 三张报表及附注的一致性
        required: true
        key_questions:
          - question_id: fin_consistency
            question: 三张报表及附注勾稽一致；多来源数字冲突时保留各来源值并生成 reconciliation issue，暂停受影响计算与 Claim
            required_aspects:
              - 三表勾稽一致性
              - 多来源冲突保留各来源并生成 reconciliation
            priority: P0
            blocking_policy: [REPORT_BLOCKED]
            impact_scope: [key_financial, solvency]
            missing_policy: conflict_pause
            evidence_requirements:
              - requirement_id: er_fin_consistency
                evidence_kind: structured_db
                source_classes: [financial]
                minimum_sources: 1
      - topic_id: fin_balance_structure
        title: 资产负债结构、重大科目变化
        required: true
        key_questions:
          - question_id: fin_balance_structure
            question: 资产负债结构与重大科目变化；科目占资产或负债 15% 以上强制分析，重点科目无论占比均分析
            required_aspects:
              - 资产负债结构
              - 重大科目变化
              - 15%以上科目强制分析
            priority: P0
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_fin_balance
                evidence_kind: table
                source_classes: [financial]
                minimum_sources: 1
      - topic_id: fin_solvency
        title: 短期与长期偿债能力、净资产与刚性债务结构
        required: true
        key_questions:
          - question_id: fin_solvency
            question: 短期与长期偿债能力、净资产水平与刚性债务结构
            required_aspects:
              - 短期偿债能力
              - 长期偿债能力
              - 净资产水平
              - 刚性债务结构
            priority: P0
            blocking_policy: NONE
            impact_scope: [solvency]
            missing_policy: write_not_found
            calculation_requirements:
              - calc_current_ratio
              - calc_quick_ratio
              - calc_debt_ratio
              - calc_interest_coverage
              - calc_ebitda_interest_coverage
      - topic_id: fin_profitability
        title: 盈利能力与利润质量
        required: true
        key_questions:
          - question_id: fin_profitability
            question: 盈利能力与利润质量
            required_aspects:
              - 毛利率
              - 净利率
              - ROE
              - ROA
              - 利润质量
