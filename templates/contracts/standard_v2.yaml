        description: 每个数据库数字保留源文件、页码/Sheet、表格与行列坐标，可回查源材料

  # ------------------------------------------------------------------
  # 3. 行业研究（受限 Harness，外部检索受预算限制）
  # ------------------------------------------------------------------
  - section_id: industry
    title: 行业研究
    purpose: 评价行业环境如何影响公司的收入、盈利、现金流和偿债能力，而非生成泛行业介绍。
    research_policy: harness
    allowed_capabilities: [search_evidence, search_tables, inspect_evidence, compare_evidence, verify_claim, search_external_sources]
    required_topics:
      - topic_id: industry_definition
        title: 行业定义、边界与公司所属细分领域
        required: true
        key_questions:
          - question_id: industry_definition
            question: 行业定义、边界与公司所属细分领域
            required_aspects:
              - 行业定义与边界
              - 公司所属细分领域
            priority: P1
            blocking_policy: NONE
            impact_scope: [subject]
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_definition
                evidence_kind: paragraph
                source_classes: [company_industry, external]
                minimum_sources: 1
      - topic_id: industry_scale_cycle
        title: 行业规模、增速与当前周期位置
        required: true
        key_questions:
          - question_id: industry_scale_cycle
            question: 行业规模、增速与当前周期位置（缺单一数字不阻断，可用代理指标）
            required_aspects:
              - 行业规模
              - 增速
              - 当前周期位置
              - 数据截止日期与统计口径
            priority: P0
            blocking_policy: NONE
            missing_policy: proxy_allowed
            evidence_requirements:
              - requirement_id: er_ind_scale
                evidence_kind: web
                source_classes: [external]
                minimum_sources: 1
                required_fields: [行业规模, 增速, 数据截止日期, 统计口径]
      - topic_id: industry_supply_demand
        title: 供需关系、价格与成本驱动因素
        required: true
        key_questions:
          - question_id: industry_supply_demand
            question: 供需关系、价格与成本驱动因素及对经营的影响
            required_aspects:
              - 供需关系
              - 价格与成本驱动
              - 对经营的影响
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_supply
                evidence_kind: web
                source_classes: [external]
                minimum_sources: 1
      - topic_id: industry_competition
        title: 竞争格局、集中度和主要参与者
        required: true
        key_questions:
          - question_id: industry_competition
            question: 竞争格局、集中度与主要参与者
            required_aspects:
              - 竞争格局与集中度
              - 主要参与者
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_competition
                evidence_kind: web
                source_classes: [external]
                minimum_sources: 1
      - topic_id: industry_policy
        title: 政策、监管、技术替代和外部冲击
        required: true
        key_questions:
          - question_id: industry_policy
            question: 政策、监管、技术替代与外部冲击
            required_aspects:
              - 政策与监管
              - 技术替代
              - 外部冲击
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_policy
                evidence_kind: web
                source_classes: [external]
                minimum_sources: 1
      - topic_id: industry_position
        title: 公司行业地位和相对竞争能力
        required: true
        key_questions:
          - question_id: industry_position
            question: 公司行业地位与相对竞争能力
            required_aspects:
              - 公司行业地位
              - 相对竞争能力
            priority: P0
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_position
                evidence_kind: web
                source_classes: [company_industry, external]
                minimum_sources: 1
      - topic_id: industry_comparables
        title: 可比公司选择与相对比较
        required: true
        key_questions:
          - question_id: industry_comparables
            question: 选择 3～5 家可比公司并做相对比较（3~5 家是目标不是门禁：1~2 家说明限制、无直接可比用相近、无合理可比说明不可比，不强行选不可比公司）
            required_aspects:
              - 可比公司选择
              - 相对比较
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_comparables
                evidence_kind: web
                source_classes: [external]
                minimum_sources: 1
      - topic_id: industry_risk_transmission
        title: 行业风险向授信主体的传导路径
        required: true
        key_questions:
          - question_id: industry_risk_transmission
            question: 行业风险向借款人收入、成本、资本开支、现金流和偿债能力的传导
            required_aspects:
              - 对收入的传导
              - 对成本与资本开支的传导
              - 对现金流与偿债能力的传导
            priority: P0
            blocking_policy: NONE
            impact_scope: [solvency]
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_transmission
                evidence_kind: paragraph
                source_classes: [company_industry, external]
                minimum_sources: 1
      - topic_id: industry_monitoring
        title: 行业结论的有效期和监测指标
        required: true
        key_questions:
          - question_id: industry_monitoring
            question: 行业结论有效期与监测指标
            required_aspects:
              - 结论有效期
              - 监测指标
            priority: P2
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_ind_monitoring
                evidence_kind: paragraph
                source_classes: [external]
                minimum_sources: 1
    output_requirements:
      - requirement_id: or_industry_structure
        kind: structured
        description: 行业边界、数据截止日期、可比公司比较，结论落到借款人的收入/成本/资本开支/现金流
    completion_rules:
      - rule_id: industry_rule_freshness
        scope_id: industry
        condition: { kind: always }
        outcome: 新闻与行业规模默认近 2 年回溯；关键市场数据须有来源、发布日期与统计口径
      - rule_id: industry_rule_source_grade
        scope_id: industry
        condition: { kind: always }
        outcome: 证据来源分 A/B/C/D 四级（A=监管/政府/交易所，B=行业协会/研究机构/公司公告，C=券商/财经媒体/头部披露，D=来源不明/聚合转载）；优先 A/B，C 可补充，D 不得作为关键结论唯一依据；来源等级低不自动阻断
      - rule_id: industry_rule_proxy_metric
        scope_id: industry
        condition: { kind: always }
        outcome: 代理指标必须记录六项：原目标指标、实际替代指标、替代理由、来源日期、口径、局限性
      - rule_id: industry_rule_comparables
        scope_id: industry
        condition: { kind: always }
        outcome: 至少完成一次公司与主要同业的相对比较；3~5 家是目标不是门禁（1~2 家说明限制、无直接可比用相近、无合理可比说明不可比），不因数量不足自动阻断、不强行选不可比公司
      - rule_id: industry_rule_section_blocked
        scope_id: industry
        condition: { kind: always }
        outcome: 仅当核心内容整体不足（无法确定所属行业、无法形成基本供需/竞争/政策判断、无法说明风险传导、检索后无替代分析）才 SECTION_BLOCKED；缺单一行业数字不阻断
    evaluation_rules:
      - rule_id: industry_eval_fact_judgment
        description: 事实与分析判断分开表达

  # ------------------------------------------------------------------
  # 4. 综合方案评价（只评价用户方案，不生成新方案，不检索）
  # ------------------------------------------------------------------
  - section_id: synthesizer
    title: 综合方案评价
    purpose: 把公司、财务和行业章节连接成完整信用逻辑，评价客户经理输入的授信方案是否与企业经营、偿债能力和风险相匹配。
    research_policy: workflow
    allowed_capabilities: []
    required_topics:
      - topic_id: synth_scheme_overview
        title: 授信主体、类型与用户输入方案概览
        required: true
        key_questions:
          - question_id: synth_scheme_overview
            question: 授信主体、授信类型与用户输入方案概览
            required_aspects:
              - 授信主体
              - 授信类型
              - 授信金额与期限
              - 增信措施
            priority: P0
            blocking_policy: REPORT_BLOCKED
            impact_scope: [credit_scheme]
            missing_policy: missing_material
            evidence_requirements:
              - requirement_id: er_synth_scheme
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
                required_fields: [授信金额, 期限, 增信措施, 授信类型]
      - topic_id: synth_strengths
        title: 支持该方案的核心优势
        required: true
        key_questions:
          - question_id: synth_strengths
            question: 支持该方案的核心优势
            required_aspects:
              - 支持方案的核心优势
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_synth_strengths
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
      - topic_id: synth_risks
        title: 核心风险及风险传导
        required: true
        key_questions:
          - question_id: synth_risks
            question: 该方案面临的核心风险及风险传导
            required_aspects:
              - 核心风险
              - 风险传导
            priority: P0
            blocking_policy: REPORT_BLOCKED
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_synth_risks
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
      - topic_id: synth_repayment
        title: 第一还款来源与现有增信措施有效性
        required: true
        key_questions:
          - question_id: synth_repayment
            question: 第一还款来源与现有增信措施的有效性
            required_aspects:
              - 第一还款来源
              - 现有增信措施有效性
            priority: P0
            blocking_policy: REPORT_BLOCKED
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_synth_repayment
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
      - topic_id: synth_evaluation
        title: 授信方案优缺点与综合评价
        required: true
        key_questions:
          - question_id: synth_evaluation
            question: 授信方案的优点、缺点与综合评价
            required_aspects:
              - 方案优点
              - 方案缺点
              - 综合评价
            priority: P0
            blocking_policy: REPORT_BLOCKED
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_synth_evaluation
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
      - topic_id: synth_mismatch
        title: 方案明显不合理时的具体不匹配项
        required: true
        key_questions:
          - question_id: synth_mismatch
            question: 若方案明显不合理，指出具体不匹配项及依据；否则不主动改写额度、期限和增信措施
            required_aspects:
              - 明显不合理时的具体不匹配项及依据
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_synth_mismatch
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
      - topic_id: synth_unresolved
        title: 未解决的信息缺口和需人工确认事项
        required: true
        key_questions:
          - question_id: synth_unresolved
            question: 仍未解决的信息缺口和需人工确认事项
            required_aspects:
              - 未解决信息缺口
              - 需人工确认事项
            priority: P1
            blocking_policy: NONE
            missing_policy: write_not_found
            evidence_requirements:
              - requirement_id: er_synth_unresolved
                evidence_kind: claim
                source_classes: []
                minimum_sources: 1
      - topic_id: synth_disclaimer
        title: AI 生成声明
        required: true
        key_questions:
          - question_id: synth_disclaimer
            question: 明确声明“本评价由 AI 生成，仅供参考”
            required_aspects:
              - AI生成声明
            priority: P0
            blocking_policy: REPORT_BLOCKED
            missing_policy: missing_material
            evidence_requirements:
              - requirement_id: er_synth_disclaimer
                evidence_kind: paragraph
                source_classes: []
                minimum_sources: 1
    output_requirements:
      - requirement_id: or_synth_structure
        kind: structured
        description: 只能使用通过章节质量门的 Claim，每个综合判断回指章节 Claim，不引入上游之外的新事实或数字
    completion_rules:
      - rule_id: synth_rule_no_new_scheme
        scope_id: synthesizer
        condition: { kind: always }
        outcome: 不主动生成新的授信额度、期限或增信措施，不引入上游章节之外的新事实或数字
      - rule_id: synth_rule_impact_scope
        scope_id: synthesizer
        condition: { kind: always }
        outcome: 按上游问题 impact_scope（subject/solvency/key_financial/credit_scheme）判断影响面：影响主体、偿债能力、关键数字或授信方案的上游问题存在未解决阻断时不生成对应结论；任一上游 SECTION_BLOCKED 仅说明无法完成对应判断；存在相关 REPORT_BLOCKED 允许预览禁止导出；非核心缺口（impact_scope 为空）仅带缺口预览；不因任意 WAITING_HUMAN 停止全部，由结构化字段判断而非 LLM 临时决定
      - rule_id: synth_rule_other_disclosure
        scope_id: synthesizer
        condition: { kind: always }
        outcome: 授信类型为 other 且未补充具体业务类型时，必须提示“尚未按具体授信业务类型追加专项分析”
      - rule_id: synth_rule_disclaimer
        scope_id: synthesizer
        condition: { kind: always }
        outcome: 必须输出“本评价由 AI 生成，仅供参考”
    evaluation_rules:
      - rule_id: synth_eval_claim
        description: 每个综合判断回指一个或多个章节 Claim
