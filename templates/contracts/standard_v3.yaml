# ---------------------------------------------------------------------------
# R1-A 冻结架构约束（冻结收口 §三）：以下两条为跨 R1-B～R7 的硬约束，R1-B 计划必须遵守。
# 状态空间隔离 + 来源权威门/充分性门两门独立，均须 fail-closed。
# ---------------------------------------------------------------------------
r1_architecture_constraints:
  constraint_state_space_isolation:
    title: "状态空间隔离"
    rule: "Harness QuestionStatus / ResearchOutcome 完成态 / TopicResearchPack 状态 / Section 状态 / Claim entailment 判定 / aspect evidence 状态分属不同状态空间，禁止字符串名互通，未知状态不等同 eligible（fail-closed）。"
    distinct_state_spaces:
      - "Harness QuestionStatus"
      - "ResearchOutcome completion status"
      - "TopicResearchPack status"
      - "Section status"
      - "Claim entailment verdict"
      - "aspect evidence state"
    requirement: "R1-B 必须提供显式状态适配函数做状态映射；任何跨状态空间的字符串名复用一律 fail-closed，未知状态不得视为 eligible。"
  constraint_authority_vs_sufficiency_gate:
    title: "来源权威门 与 来源充分性门 相互独立"
    rule: "min_grade=C 仅表示候选事实资格，不代表单一 C 足以支撑关键结论；关键行业结论仍需 ≥1 直接 A/B 或 ≥2 独立一致 C。两门不得合并，不得自动提升单一 C。"
    authority_gate: "min_grade=C 为候选事实资格门槛（source authority gate）"
    sufficiency_gate: "关键行业结论来源充分性门：≥1 直接 A/B 或 ≥2 独立一致 C"
    requirement: "两门独立判定，不得把来源权威门通过解释为来源充分性门满足，也不得把单一 C 自动提升为关键结论依据。"

source_policy_ref: "source_policy_v1"
source_policy_asset: "templates/policies/source_policy_v1.yaml"

allowed_capabilities:
  - search_evidence
  - search_tables
  - inspect_evidence
  - compare_evidence
  - verify_claim
  - search_external_sources
  - fetch_external_content
  - lookup_financial_metric
  - lookup_company_field

# ---------------------------------------------------------------------------
# 五类 canonical 时间政策（R1-A §八）
# ---------------------------------------------------------------------------
time_policies:
  CURRENT_AS_OF_WITH_24M_CHANGES:
    description: "当前股权/控制链/子公司/关联方/管理层/授信/借款/担保/质押/股权激励/在建工程"
    semantics: "以 report_as_of 为准检查当前现状 + 最近 24 个月重大变化"
  RECENT_24M_WITH_OPEN_TAIL:
    description: "收并购/重大投资/资产出售/定增/诉讼/仲裁/处罚/违约/失信/退市风险/重大舆情/外部冲击/债务逾期/债务违约/破产重整"
    semantics: "默认 24 个月；早于 24 个月但未完结/仍在整改/仍有付款义务/商誉整合风险/持续经营影响的必须继续纳入"
  SINCE_INCEPTION_MILESTONES:
    description: "成立/改制/更名/重大股权实控人变化/上市/重大募资/核心业务转型"
    semantics: "自成立以来的重大节点，只保留重大节点不写流水账"
  THREE_YEARS_PLUS_LATEST:
    description: "财务报表/收入成本/盈利/现金流/资产负债/研发/客户供应商集中度"
    semantics: "最近三个完整年度 + 最新一期；最新季度单独展示，不与年度混算"
  STRUCTURAL_5Y_CURRENT:
    description: "行业格局/技术路线/竞争演变/产能周期"
    semantics: "近 5 年结构演变 + 近 24 个月当前判断；仍有效且有重大影响的早期政策继续保留"
  debt_term_note: "债务期限结构以当前时点为准，突出未来 12 个月，必要时扩展至 24 个月。"

# ---------------------------------------------------------------------------
# 缺失策略（v1 五类保留 + 无可比期间）
# ---------------------------------------------------------------------------
missing_policies:
  write_not_found: "明确写『未在给定材料及已执行来源中检索到』，不视为事实不存在，允许带缺口预览"
  write_not_found_disclose: "依法未披露（如客户/供应商名称）时标注『依法未披露』，不视为事实不存在，不阻断"
  transfer_human: "仅转人工复核或阻断（WAITING_HUMAN/BLOCKED），运行时只读，不再自动继续受影响部分"
  valid_no_controller: "『无实际控制人』是合法结论（SATISFIED），与控制关系无法确认（WAITING_HUMAN）区分"
  not_applicable_no_plan: "无相关计划/安排时记为合法不适用（NOT_APPLICABLE），不阻断"
  not_applicable_no_comparable_period: "无可比期间时记为合法不适用（NOT_APPLICABLE），不视为事实缺失，不阻断"

# ---------------------------------------------------------------------------
# 负面/事件两类正文表达（R1-A §七）
# ---------------------------------------------------------------------------
negative_event_body_policy:
  allowed_body_forms:
    - "已检索到以下事项"
    - "在明确列示的检索范围内未发现相关事项"
  forbidden_body_forms:
    - "该事项不存在"
    - "无诉讼"
    - "无处罚"
    - "无失信"
  to_limitation_zone: ["blocked", "source_unavailable", "budget_exhausted", "needs_human_review"]
  event_core_fields: ["事件类别", "日期", "涉及主体", "当前状态", "来源和检索范围"]
  event_extension_fields: ["金额或规模", "进展", "处理结果", "对经营现金流信用风险的影响"]
  extension_gap_rule: "扩展字段未披露时记录字段级 gap，不得丢弃整个已验证事件"

# ---------------------------------------------------------------------------
# 行业风险传导四层 + 四条独立通道（R1-A §九 / §四）
# ---------------------------------------------------------------------------
industry_transmission_layers:
  - industry_background
  - conditional_transmission
  - company_exposure
  - actual_company_impact
transmission_channels:
  - channel: demand_revenue
    label: "需求/收入"
  - channel: raw_material_cost
    label: "原材料/成本"
  - channel: capacity_capex
    label: "产能/资本开支"
  - channel: cashflow_solvency
    label: "现金流/偿债"
transmission_note: "行业背景（industry_background）按行业来源政策进入背景正文；条件性传导（conditional_transmission）须使用『可能/通常/取决于』表述并保留 inference 依据；公司暴露（company_exposure）需定性公司事实；实际影响（actual_company_impact）需定量公司暴露/财务影响/管理层披露；缺公司证据时不得清空有效的行业背景/条件性分析，也不得把影响写成已经发生。Contract 只存静态 TransmissionRequirement，不放运行态 fact/citation/status。"

# ---------------------------------------------------------------------------
# 可组合覆盖规则注册表（R1-A §六）
# ---------------------------------------------------------------------------
coverage_rules_registry:
  set_complete: "权威集合全量覆盖；集合锚点=表题/表头/合计行/权威清单/披露章节边界/明确的『主要/重要』主体表"
  required_fields_complete: "required_fields 所列字段全部取得"
  minimum_sources: "来源数量满足 evidence requirement 的 minimum_sources"
  direct_support: "每条事实均有直接引用（fact → citation → material/snapshot 支持边）"
  search_audit: "检索范围与截止日期已记录（仅负面核验/not_found/集合完整性/外部时效）"
  applicability: "applicability_policy 已评估；not_applicable 是经 applicability_policy 验证后的运行终态分支，不是 coverage mode"
  snapshot_authority: "数字权威来自已校验 FinancialSnapshot（不作自证）"
  item_formula_identity: "指标/科目身份与 formula_id 一致"
  period: "期间明确（年度/时点/季度，不混算）"
  scope: "合并/母公司口径明确"
  currency_unit: "币种与单位明确"
  required_input_completeness: "计算所需输入字段完整"
  calculation_provenance: "计算链路可溯源（Python/SQL，LLM 不计算）"
  comparability: "期间可比性按公式 period_requirement 判定"
  upstream_aspect_coverage: "上游 required aspect 覆盖率"
  pack_claim_identity: "输入 Pack/Claim 身份一致"
  dependency_lineage: "依赖血缘可溯源"
  conflict_propagation: "上游冲突/未解决正确传播"
  upstream_dependency_coverage: "上游依赖覆盖"
  synthesis_lineage: "综合血缘可溯源"
  conflict_limitation_propagation: "冲突/限制传播"

# ---------------------------------------------------------------------------
# 派生输入资格政策（R1-A §四，typed 版本化；与 contracts/schema_v2.py
# DERIVED_ELIGIBILITY_POLICY 逐字段一致，validator 强制完整）
# ---------------------------------------------------------------------------
derived_input_eligibility:
  policy_id: derived-input-eligibility-v1
  schema_version: derived-input-eligibility-v1
  question_states_eligible: [COMPLETED, COMPLETED_WITH_GAPS]
  question_states_ineligible: [PENDING, ROUTED, RESEARCHING, ANSWER_READY, WAITING_HUMAN, BLOCKED, FAILED]
  pack_section_states_eligible: [COMPLETED, COMPLETED_WITH_GAPS]
  pack_section_states_ineligible: [UNRESOLVED, NOT_IMPLEMENTED, FAILED]
  claim_verdicts_eligible: [SUPPORTED]
  claim_verdicts_ineligible: [PARTIAL, UNSUPPORTED]
  unsupported_fact_states: [NOT_PROVIDED, NOT_APPLICABLE, CONFLICT, WAITING_HUMAN]
  negative_observation_state: NOT_FOUND_AFTER_SEARCH
  negative_observation_condition: search_audit_qualified
  excludes_display_tiers: [diagnostic_only]
  requires_qualified_citation: true
  requires_no_unresolved_conflict: true

# ---------------------------------------------------------------------------
# 证据需求注册表（evidence_requirement_ids 解析目标）
# ---------------------------------------------------------------------------
evidence_requirements:
  er_comp_subject: {evidence_kind: field, source_classes: [company_industry, structured_db, external], minimum_sources: 1, required_fields: [企业名称, 股票代码, 经营状态]}
  er_comp_basic: {evidence_kind: field, source_classes: [company_industry], minimum_sources: 1, required_fields: [成立日期, 办公地址, 法定代表人, 注册资本, 实缴资本, 经营范围]}
  er_comp_history: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_control_chain: {evidence_kind: field, source_classes: [company_industry, structured_db, external], minimum_sources: 1, required_fields: [控股股东, 实际控制人, 持股比例]}
  er_subsidiaries: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_business: {evidence_kind: field, source_classes: [company_industry, structured_db], minimum_sources: 1}
  er_business_model: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_customer: {evidence_kind: table, source_classes: [company_industry], minimum_sources: 1}
  er_supplier: {evidence_kind: table, source_classes: [company_industry], minimum_sources: 1}
  er_competitiveness: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_rd: {evidence_kind: field, source_classes: [company_industry], minimum_sources: 1}
  er_governance: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_litigation: {evidence_kind: paragraph, source_classes: [company_industry, external], minimum_sources: 1}
  er_related: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_pledge: {evidence_kind: paragraph, source_classes: [company_industry, external], minimum_sources: 1}
  er_debt: {evidence_kind: field, source_classes: [company_industry, structured_db], minimum_sources: 1}
  er_profit_quality: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_investment: {evidence_kind: paragraph, source_classes: [company_industry, external], minimum_sources: 1}
  er_equity_incentive: {evidence_kind: paragraph, source_classes: [company_industry], minimum_sources: 1}
  er_credit_summary: {evidence_kind: claim, source_classes: [company_industry], minimum_sources: 1}
  er_fin_statements: {evidence_kind: structured_db, source_classes: [structured_db], minimum_sources: 1}
  er_fin_audit: {evidence_kind: field, source_classes: [company_industry], minimum_sources: 1, required_fields: [审计意见类型, 会计师事务所]}
  er_fin_scope: {evidence_kind: structured_db, source_classes: [structured_db], minimum_sources: 1, required_fields: [报告期, 合并范围, 金额单位]}
  er_fin_consistency: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_balance: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_solvency: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_profitability: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_operating: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_cashflow: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_growth: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_asset_quality: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_risk_summary: {evidence_kind: claim, source_classes: [structured_db], minimum_sources: 1}
  er_fin_working_capital: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_trade_finance: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_fin_capital_capacity: {evidence_kind: calculation, source_classes: [structured_db], minimum_sources: 1}
  er_ind_definition: {evidence_kind: web, source_classes: [external, company_industry], minimum_sources: 1}
  er_ind_scale: {evidence_kind: web, source_classes: [external], minimum_sources: 1}
  er_ind_supply_demand: {evidence_kind: web, source_classes: [external], minimum_sources: 1}
  er_ind_competition: {evidence_kind: web, source_classes: [external], minimum_sources: 1}
  er_ind_policy: {evidence_kind: web, source_classes: [external], minimum_sources: 1}
  er_ind_position: {evidence_kind: web, source_classes: [external], minimum_sources: 1}
  er_ind_comparables: {evidence_kind: web, source_classes: [external], minimum_sources: 1}
  er_ind_transmission_background:
    evidence_kind: claim
    source_classes: [external]
    minimum_sources: 1
    # 行业背景：qualified external（A/B/C 分级门槛，D 级不得进入背景正文）。
    authority:
      required_any_of:
        - {source_classes: [external], min_grade: C}
      supplemental_only: []
  er_ind_transmission_conditional:
    evidence_kind: inference
    source_classes: [external, company_industry]
    minimum_sources: 1
    # 条件性传导：引用已验证事实，并保留完整 inference 血缘（缺任一字段即失败）。
    authority:
      required_any_of:
        - {source_classes: [external, company_industry], kind: verified_fact}
      supplemental_only: []
      inference_lineage:
        required: true
        fields: [inference_policy_ref, channel, direction, conditions, limitation, derived_from_fact_ids]
  er_ind_transmission_exposure:
    evidence_kind: claim
    source_classes: [company_industry]
    minimum_sources: 1
    # 公司暴露：至少一个公司披露/结构化财务，external 仅补充（不得作为 required_any_of）。
    authority:
      required_any_of:
        - {source_classes: [company_industry]}
        - {source_classes: [structured_db]}
      supplemental_only: [external]
  er_ind_transmission_impact:
    evidence_kind: claim
    source_classes: [company_industry, financial, structured_db]
    minimum_sources: 1
    # 实际影响：至少一个直接披露/管理层/结构化影响，external 仅补充（不得作为 required_any_of）。
    authority:
      required_any_of:
        - {source_classes: [company_industry]}
        - {source_classes: [financial]}
        - {source_classes: [structured_db]}
      supplemental_only: [external]
  er_ind_monitoring: {evidence_kind: claim, source_classes: [external], minimum_sources: 1}
  er_synth_scheme: {evidence_kind: claim, source_classes: [], minimum_sources: 0}
  er_synth_generic: {evidence_kind: claim, source_classes: [], minimum_sources: 0}

