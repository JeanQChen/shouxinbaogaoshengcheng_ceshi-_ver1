# =============================================================================
# Contract v2（R1-A 冻结资产，已批准、已冻结、未接线）
# 载体：templates/contracts/standard_v3.yaml —— 唯一 v2 载体，不得覆盖 standard_v2.yaml。
#
# 本文件是 Contract v2 的声明式来源：52 问逐 question、逐 aspect 冻结稳定 aspect_id、
# 可组合 coverage_rules、五类时间政策、负面事件两类正文表达、行业传导四层语义与四条通道。
# 仅被 contracts/loader_v2.py / validator_v2.py / review/topic_aspect_evidence_review.py
# 与离线测试读取；不得接入正式 Router / Harness runtime / Worker / Writer，不得作为
# 正式默认 Contract。
#
# 通用约束：不写 case_id / 300750 / 宁德时代 / 固定页码 / gold / 固定答案关键词。
# 每个 aspect 经 YAML 锚点合并后至少含 22 字段（见 contracts/schema_v2.py REQUIRED_ASPECT_FIELDS）。
# display_semantics 已拆为 display_tier（required_body/optional_body/diagnostic_only）与
# content_role（paragraph/table/paragraph_and_table/risk_note/search_scope_note/audit_only）两个独立维度。
# =============================================================================

