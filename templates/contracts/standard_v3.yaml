sections:
  # ===========================================================================
  # 公司信用研究（8 H2，21 问：20 topic_harness + 1 phase4_section_derived）
  # ===========================================================================
  - section_id: company
    title: "公司信用研究"
    purpose: "确认申请授信的法人主体是否合法存续、控制权是否清晰、经营是否有效，及其业务与经营能力能否支持还款。"
    research_policy: harness
    allowed_capabilities: [search_evidence, search_tables, inspect_evidence, compare_evidence, verify_claim, search_external_sources, fetch_external_content]
    topics:
      - topic_id: company_identity
        title: "企业基本信息与历史沿革"
        producer_kind: topic_harness
        questions:
          - question_id: company_subject_match
            question: "核对输入企业名称、材料内主体、股票代码与公开企业信息是否一致"
            priority: P0
            producer_kind: topic_harness
            execution_path: topic_harness
            blocking_policy: [JOB_BLOCKED]
            missing_policy: transfer_human
            aspects:
              - aspect_id: company_subject_match.name_consistency
                <<: *harness
                question_id: company_subject_match
                topic_id: company_identity
                requirement_text: "输入企业名称与材料主体一致"
                kind: fact_set
                required_fields: [企业名称]
                coverage_rules: [required_fields_complete, minimum_sources, direct_support]
                complete_set_rule: ""
                evidence_requirement_ids: [er_comp_subject]
                time_scope: CURRENT_AS_OF_WITH_24M_CHANGES
                display_tier: required_body
                content_role: paragraph
                missing_policy: transfer_human
                blocking_policy: [JOB_BLOCKED]
                impact_scope: [subject]
                output_destination: body
              - aspect_id: company_subject_match.stock_code
                <<: *harness
                question_id: company_subject_match
                topic_id: company_identity
                requirement_text: "股票代码"
                kind: fact_set
                required_fields: [股票代码]
                coverage_rules: [required_fields_complete, minimum_sources, direct_support]
                complete_set_rule: ""
                evidence_requirement_ids: [er_comp_subject]
                time_scope: CURRENT_AS_OF_WITH_24M_CHANGES
                display_tier: required_body
                content_role: paragraph
                missing_policy: transfer_human
                blocking_policy: [JOB_BLOCKED]
                impact_scope: [subject]
                output_destination: body
              - aspect_id: company_subject_match.operating_status
                <<: *harness
                question_id: company_subject_match
                topic_id: company_identity
                requirement_text: "经营状态（存续/注销/吊销等）"
                kind: fact_set
